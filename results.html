<main class="contenedor">
    <h1 class="centrar-texto">Resultados</h1>

    <section id="status" class="pacient-form">
      <p id="status-message">Seleccione un archivo para generar el PDF</p>

      <div style="margin-top: 12px; margin-bottom: 8px;">
        <label for="hl7file" style="font-weight:700; display:block; margin-bottom:6px;">Archivo HL7:</label>
        <input type="file" id="hl7file" accept=".hl7,.txt" />
      </div>

      <div style="margin-top: 8px;">
        <label for="patient-select" style="font-weight:700; display:block; margin-bottom:6px;">Paciente:</label>
        <select id="patient-select">
          <option value="">-- paciente --</option>
        </select>
        <p id="patient-phone" style="margin-top:6px; color:#333;"></p>
      </div>

      <div style="display:flex; gap:8px; align-items:center; margin-top:12px;">
        <button id="generate-pdf-btn" class="boton boton_agregar">Generate PDF</button>

        <button id="send-whatsapp-btn" class="boton" style="background:#25D366;">Send to WhatsApp</button>
      </div>

      <p id="report-link" style="display:none; margin-top:12px;">
        Report:
        <a id="report-path" href="#" target="_blank">Open generated report</a>
      </p>
    </section>
  </main>
